schema_version: 2
kind: RunManifest002Extensions
description: >-
  Corpus/mapping extensions to the shared experiment manifest semantic contract.
  These additional fields do not redefine shared provenance or introduce Git,
  source checkout, pin-enforcement or service lifecycle requirements.
  Emitters own executable schemas and wire-format version alignment.

extends: specs/001-harness-control-plane-foundation/contracts/run-manifest.schema.yaml

additional_top_level_required:
  - conceptmap_path
  - conceptmap_checksum
  - sqlmesh_project_path
  - sqlmesh_project_checksum
  - concept_translation_seed_checksum
  - module_table_policy_seed_checksum
  - ocl_collection_versions
  - openmrs_refapp_image_digest
  - mariadb_image_digest
  - fhir_validator_version
  - sqlmesh_version

  - python_version
  - equivalence_labels
  - policy_buckets
  - reviewer_signoffs
  - materialized_outputs

fields:
  conceptmap_path:
    type: string
    expected: datasets/mappings/openmrs-2.7-to-2.8.conceptmap.json
  conceptmap_checksum:
    type: string
    description: SHA-256 of the accepted ConceptMap file at run time.
  sqlmesh_project_path:
    type: string
    expected: datasets/transforms/sqlmesh
  sqlmesh_project_checksum:
    type: string
    description: SHA-256 of a normalized tar of datasets/transforms/sqlmesh/ at run time (excluding seeds/ which are checksummed separately).
  concept_translation_seed_checksum:
    type: string
    description: SHA-256 of datasets/transforms/sqlmesh/seeds/concept_translation.csv (must match what `harness.conceptmap.seed_emit` would produce from the accepted ConceptMap at this run's checksum).
  module_table_policy_seed_checksum:
    type: string
    description: SHA-256 of datasets/transforms/sqlmesh/seeds/module_table_policy.csv.
  ocl_collection_versions:
    type: array
    items:
      required:
        - collection
        - version
        - snapshot_path
        - checksum
      properties:
        collection:
          type: string
          allowed: [CIEL, LOINC, SNOMED-CT]
        version:
          type: string
        snapshot_path:
          type: string
          pattern: ^datasets/sources/ocl/[^/]+/[^/]+/$
        checksum:
          type: string
  openmrs_refapp_image_digest:
    type: [string, "null"]
    description: Caller-supplied or API-observed image digest; null when unavailable, never fetched by runner setup.
  mariadb_image_digest:
    type: [string, "null"]
    description: Caller-supplied or observed database image digest; null when unavailable.
  fhir_validator_version:
    type: string
  sqlmesh_version:
    type: string

  python_version:
    type: string
  equivalence_labels:
    type: array
    description: >-
      FHIR R4 ConceptMap equivalence vocabulary used by the accepted ConceptMap.
      Describes the *semantic relationship* between source and target concepts.
      Each label may be empty (zero map elements with that label).
    items:
      type: string
      allowed:
        - equivalent
        - equal
        - wider
        - narrower
        - inexact
        - unmatched
        - disjoint
  policy_buckets:
    type: array
    description: >-
      Harness-internal policy decisions per row. Disjoint from
      `equivalence_labels` — describes the *action* taken during transform.
      `unmatched` (an equivalence label) is not the same as `drop` (a policy
      bucket); a row can be `unmatched` and still kept under a different policy.
      Each bucket may be empty.
    items:
      type: string
      allowed:
        - remap
        - seed-augment
        - drop
  reviewer_signoffs:
    type: array
    items:
      required:
        - document_path
        - document_checksum
        - signer
        - signed_at
      properties:
        document_path:
          type: string
        document_checksum:
          type: string
        signer:
          type: string
          description: Identifier (email or GitHub handle).
        signed_at:
          type: string
          format: date-time
  materialized_outputs:
    type: array
    description: >-
      Per-table state of the materialized target schema (refapp_28_demo)
      at the end of the transform run. Lets two runs that should be
      byte-identical compare row-by-row without diffing the full dump.
      A SC-004 (determinism) regression manifests as a mismatch here.
      Mandatory for clinical marts (clin__obs, clin__drug_order,
      clin__conditions, clin__allergy, clin__test_order); optional for
      staging and module models.
    items:
      required:
        - table_name
        - row_count
        - content_checksum
        - checksum_method
      properties:
        table_name:
          type: string
          description: Two-part name `<schema>.<table>` or just `<table>` if schema is implicit.
        row_count:
          type: integer
          minimum: 0
        content_checksum:
          type: string
          description: >-
            Content checksum, formatted per `checksum_method`. For
            `mariadb_checksum_table` this is the decimal integer
            CHECKSUM TABLE returned, rendered as a string.
        checksum_method:
          type: string
          allowed:
            - mariadb_checksum_table
            - sha256_of_canonical_dump

rules:
  - Evidence classification retains rationale and claim limits; it does not grant release approval or enforce product pins.
  - OCL collection versions MUST contain at least one CIEL entry. LOINC is required when the ConceptMap references LOINC reference terms (typical for lab analyte concepts).
  - The concept translation seed checksum MUST match deterministic seed emission from the accepted ConceptMap at its recorded checksum. Mismatch blocks accepted transform evidence.
  - Record supplied/observed provenance only for interfaces actually exercised in the selected stage, with nullable target revisions and explicit missing metadata. Repository-only references are not runtime targets.
  - Keep caller assertions separate from observations and disclose conflicts; no Git lookup or pin/override status.
  - Capture mapping/snapshot/fixture bytes required for offline reports under safe run-relative evidence references.
