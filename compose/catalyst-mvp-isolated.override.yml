name: catalyst-mvp-isolated

# The upstream OpenELIS compose file owns a globally named 172.20.1.0/24
# network and globally named containers. The harness keeps its MVP disposable
# and isolated from any other OpenELIS checkout on the same workstation.
services:
  certs:
    container_name: catalyst-mvp-isolated-certs

  db.openelis.org:
    container_name: catalyst-mvp-isolated-openelis-db
    ports: !override
      - "127.0.0.1:25432:5432"

  oe.openelis.org:
    container_name: catalyst-mvp-isolated-openelis-app
    ports: !override
      - "127.0.0.1:28080:8080"
      - "127.0.0.1:28443:8443"
    networks:
      openelis-network:
        ipv4_address: 192.168.166.121

  fhir.openelis.org:
    container_name: catalyst-mvp-isolated-hapi-fhir
    ports: !override
      - "127.0.0.1:28081:8080"
      - "127.0.0.1:28444:8443"

networks:
  openelis-network:
    name: catalyst-mvp-isolated-network
    ipam:
      config: !override
        - subnet: 192.168.166.0/24
