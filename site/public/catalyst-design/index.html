<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalyst and OpenELIS · design review</title>
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="appearance.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; height: 100dvh; display: flex; flex-direction: column; background: var(--background); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
    header { padding: 12px 20px; background: var(--layer); border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; }
    h1 { font-size: 16px; margin: 0; } p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    label { display: flex; gap: 8px; align-items: center; }
    select, button, a { font: inherit; min-height: 36px; }
    select, button { background: var(--field); color: var(--text); border: 1px solid var(--control-border); border-radius: 6px; padding: 7px 10px; }
    a { color: var(--action-text); padding: 8px 0; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; }
    button { cursor: pointer; }
    button[aria-current] { box-shadow: inset 0 -2px var(--accent); font-weight: 600; background: var(--layer); }
    select:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
    .subhead { padding: 8px 20px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 24px; border-bottom: 1px solid var(--border); }
    main { flex: 1; min-height: 0; padding: 12px; overflow: auto; }
    iframe { display: block; width: 100%; height: 100%; min-height: 560px; margin: auto; border: 1px solid var(--border); background: var(--layer); }
    [hidden] { display: none !important; }
    .revision { margin-left: auto; font-size: 12px; color: var(--muted); }
    @media(max-width: 640px) { header, .subhead { padding: 10px 12px; gap: 8px 12px; } main { padding: 0; } select { max-width: 200px; } .revision { margin-left: 0; } h1 { font-size: 15px; } }
  </style>
</head>
<body>
  <header>
    <div><h1>Design review</h1><p>Interactive mocks · fictional examples · no live sign-in, AI or clinical-data requests</p></div>
    <label>Design <select id="design"><option value="approved">Approved Catalyst</option><option value="integration">OpenELIS integration draft</option></select></label>
    <label>Width <select id="width"><option value="100%">Fill window</option><option value="1280px">1280 px</option><option value="640px">640 px</option><option value="390px">390 px</option><option value="320px">320 px</option></select></label>
    <a id="spec-link" href="https://github.com/DIGI-UW/catalyst-ai/blob/ee7d0385adf457e1454fec83f56cc42cab3d9ed0/docs/specs/staff-workbench-ux/spec.md">Design specification</a>
    <span class="revision">Source: <a id="source-revision" href="https://github.com/DIGI-UW/catalyst-ai/commit/ee7d0385adf457e1454fec83f56cc42cab3d9ed0">ee7d0385adf4</a></span>
  </header>
  <div class="subhead">
    <label id="approved-controls">Screen <select id="screen">
      <option value="empty">First question</option><option value="results">Results</option><option value="ready">Query ready</option><option value="limited">Limited results</option>
      <option value="error">Database error</option><option value="clarify">Clarification</option><option value="unsupported">Unable to answer</option><option value="datasets">Saved queries and SQL reuse</option>
      <option value="widgets">Charts and tables</option><option value="dashboards">Dashboards</option><option value="imported">Dashboard imported</option><option value="import-failed">Dashboard import failed</option>
    </select></label>
    <nav id="integration-controls" aria-label="Review surfaces" hidden>
      <button data-view="catalyst" aria-current="page">Catalyst</button><button data-view="parity">Parity review</button><a href="https://digi-uw.github.io/openelis-work/#/reports/custom-data-export" target="_blank" rel="noopener">OpenELIS reporting mock ↗</a>
    </nav>
    <p id="context-note">Approved presentation reference.</p>
  </div>
  <main>
    <iframe id="approved" title="Approved Catalyst mock" src="mock.html?state=empty"></iframe>
    <iframe id="catalyst" title="Catalyst integration draft" src="integration/app.html?app=catalyst" hidden></iframe>
    <iframe id="parity" title="Parity review examples" src="integration/app.html?app=parity" hidden></iframe>
  </main>
  <script src="integration/review.js" data-approved-spec="https://github.com/DIGI-UW/catalyst-ai/blob/ee7d0385adf457e1454fec83f56cc42cab3d9ed0/docs/specs/staff-workbench-ux/spec.md" data-integration-spec="https://github.com/DIGI-UW/catalyst-ai/blob/ee7d0385adf457e1454fec83f56cc42cab3d9ed0/docs/specs/openelis-reporting-integration/spec.md"></script>
</body>
</html>
