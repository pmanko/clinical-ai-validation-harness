name: CSiM dashboard regression

on:
  pull_request:
    paths: ['tools/csim-superset/**', '.github/workflows/csim-dashboard.yml']
  push:
    branches: [main]
    paths: ['tools/csim-superset/**', '.github/workflows/csim-dashboard.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: csim-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      CSIM_RECORD: '0'
      CSIM_IMPORT_EVIDENCE: '1'
      CSIM_PREVIEW_EVIDENCE: '1'
      CSIM_OVERVIEW_URL: http://127.0.0.1:18769/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/csim-superset/e2e/package-lock.json
      - name: Install browser test dependencies
        working-directory: tools/csim-superset/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start two independent dashboards with invented data
        working-directory: tools/csim-superset
        run: |
          mkdir -p output
          bash local.sh bundle-boot
          bash local.sh full-test
          bash bundle-check.sh up
          bash bundle-check.sh import
          bash bundle-check.sh test
      - name: Start the pinned upstream snapshot and its independent time menus
        working-directory: tools/csim-superset
        run: |
          bash preview.sh up
          bash preview.sh seed
          bash preview.sh import
          bash preview.sh test
      - name: Serve the current overview and navigation preview
        working-directory: tools/csim-superset
        run: |
          node e2e/report.mjs output/ci-navigation --preview
          ln -s ../output/ci-navigation/public design/evidence
          nohup python3 -m http.server 18769 --bind 127.0.0.1 --directory design > output/overview.log 2>&1 &
      - name: Run all dashboard, overview and navigation checks without video
        working-directory: tools/csim-superset/e2e
        run: |
          npm test
          node assert-ci.mjs
      - name: Run the full dashboard browser suite on the snapshot without video
        working-directory: tools/csim-superset/e2e
        env:
          CSIM_BASE_URL: http://127.0.0.1:18095
          CSIM_ENV_FILE: ../.env.preview
          CSIM_PREVIEW_EVIDENCE: '0'
          CSIM_IMPORT_EVIDENCE: '0'
        run: npm test -- --grep '02 ·|03 ·|04 ·|05 ·|06 ·|08 ·'
      - name: Save regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csim-regression
          retention-days: 14
          path: |
            tools/csim-superset/output/browser/*/results.json
            tools/csim-superset/output/browser/*/regression-summary.json
            tools/csim-superset/output/browser/*/provenance.json
            tools/csim-superset/output/browser/*/results/**/*.png
            tools/csim-superset/output/bundle-relationships.json
            tools/csim-superset/output/bundle-verification.json
            tools/csim-superset/output/preview-verification.json
            tools/csim-superset/output/preview-import-check.json
      - name: Stop test instances
        if: always()
        working-directory: tools/csim-superset
        run: |
          bash preview.sh down
          bash bundle-check.sh down
          bash local.sh down
