name: harness-ci

# Durable, bypass-proof TDD backstop for the harness Python repo (the agent has
# no merge rights, so this cannot be skipped the way a local pre-commit can).
# Runs the harness test suite and enforces that changed production lines are
# actually covered by a test. Mark this check "required" in branch protection.
#
# Scope: tests execute the harness only (`--ignore=targets`), while checkout still
# includes submodules because profile/config metadata is part of the parent contract.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ShellCheck is scoped to the compose-lifecycle scripts this PR touches, not all
  # of scripts/ — the rest of the directory isn't ShellCheck-clean yet and cleaning
  # it up is out of scope here. Extend this list as more scripts get verified clean.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck the compose-lifecycle scripts
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/stack-up.sh \
            scripts/stack-down.sh \
            scripts/local-stack-up.sh \
            scripts/local-stack-down.sh \
            scripts/verify-repository-lines.sh

  openmrs-integration-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch authoritative integration refs
        run: |
          for repo in \
            targets/chartsearchai \
            targets/chartsearchai-esm \
            targets/querystore; do
            git -C "$repo" fetch origin \
              harness-integration:refs/remotes/origin/harness-integration
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build the pinned QueryStore and ChartSearchAI source pair
        run: make openmrs-source-pair-test

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: targets/chartsearchai-esm/yarn.lock

      - name: Install and verify the pinned ChartSearchAI ESM
        working-directory: targets/chartsearchai-esm
        run: |
          yarn install --immutable
          yarn extract-translations
          git diff --exit-code translations/
          yarn lint
          yarn typescript
          yarn test --coverage
          yarn build

  pytest-and-diff-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # diff-cover needs history to compare against the base
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install gate-script tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Set up Python + venv
        run: |
          uv python install 3.11
          uv venv

      - name: Install harness + test/coverage tooling
        run: uv pip install -e ".[dev]" pytest-cov diff-cover

      - name: Install Playwright browser (for the report layout test)
        run: uv run playwright install --with-deps chromium

      - name: Run harness tests with coverage
        # --cov scope must match what diff-cover gates: the gate counts changed lines in
        # both harness/ AND scripts/, so instrument BOTH. Without --cov=scripts, changed
        # scripts/*.py lines show 0% in diff-cover (they're absent from coverage.xml) and
        # drag the changed-line total below the bar even when they ARE tested.
        run: |
          uv run pytest -m 'not slow' --ignore=targets \
            --cov=harness --cov=scripts --cov-report=xml --cov-report=term-missing

      - name: Enforce coverage on changed lines
        run: |
          uv run diff-cover coverage.xml \
            --compare-branch "origin/${{ github.base_ref || 'main' }}" \
            --fail-under 90
