# gitleaks configuration for the validation harness.
#
# Every entry below is a value that is deliberately public: a stock demo
# credential or a documented placeholder. Nothing here suppresses a real
# secret, and the allowlists match on the literal values rather than on the
# files that contain them, so a genuine credential appearing in the same file
# still gets reported.
#
# Note on how to run this: `gitleaks git .` scans what the repository actually
# contains. `gitleaks dir .` walks the working tree, which includes gitignored
# vendored checkouts (targets/catalyst/.fhir-data-pipes) and runtime artifacts
# (targets/catalyst/logs/*.pem|.p12, real TLS material generated by the MVP
# health script). Those are not in the repository — the path allowlist below
# keeps a casual `dir` scan from drowning in them.

[extend]
useDefault = true

[[allowlists]]
description = """
Stock demo credentials. admin:Admin123 is the default OpenMRS RefApp login,
published in upstream documentation; it appears in bring-up scripts and specs
because that is what the demo stack is seeded with. The demo-*-change-me
strings are the analytics database placeholders — the name is the instruction.

These are not currently flagged by the default ruleset, but they are exactly
the class of value a stricter rule would flag, and listing them records that
they are intentional rather than leaving the next person to re-derive it.
"""
regexes = [
  '''admin:Admin123''',
  '''demo-only-change-me''',
  '''demo-readonly-change-me''',
  # A fixed value in a Catalyst UI test fixture. Repeated from that submodule's
  # own .gitleaks.toml because `gitleaks dir .` from here walks into submodules
  # without reading their configs.
  '''idempotency-123''',
]

[[allowlists]]
description = """
Gitignored paths: an upstream fhir-data-pipes checkout vendored for bootstrap,
and runtime TLS material the MVP health script copies out of the OpenELIS
container. Neither is tracked — confirmed with `git ls-files` — so a finding
here is scanner noise from the working tree, not repository content.
"""
paths = [
  '''targets/catalyst/\.fhir-data-pipes/''',
  '''targets/catalyst/logs/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
]
