# Catalyst server model presets. The deployment wrapper verifies these exact
# local files before starting the router; llama.cpp does not download models.

[*]
ctx-size = 24576
parallel = 1
# Bound CPU prompt batches so disconnects can be observed between evaluations.
batch-size = 128
temp = 0
seed = 42
dry-multiplier = 0.8
dry-base = 1.75
dry-allowed-length = 8
dry-penalty-last-n = 24576
reasoning-budget = 0

[gemma-4-12b-q4]
model = /models/gemma-4-12b-it-Q4_K_M.gguf

[gemma-e4b]
model = /models/gemma-4-E4B-it-Q4_K_M.gguf
