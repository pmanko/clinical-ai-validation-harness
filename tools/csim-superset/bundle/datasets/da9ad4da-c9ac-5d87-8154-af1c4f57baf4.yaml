sql: "SELECT p.*,\n{% if from_dttm %} TIMESTAMP '{{ from_dttm }}'\n{% elif to_dttm %} TIMESTAMP '{{ to_dttm\
  \ }}' - INTERVAL '1 microsecond'\n{% else %} TIMESTAMP '1970-01-01' {% endif %} AS filter_anchor\nFROM\
  \ (\nSELECT p.*, NULL::date AS month_date FROM (\n{% set grain = {'P1M':'month','P3M':'quarter','P1Y':'year'}.get(time_grain,\
  \ 'month') %}\n{% set label_format = {'month':'YYYY-MM','quarter':'YYYY \"Q\"Q','year':'YYYY'}[grain]\
  \ %}\n{% set tf = {'from_expr': \"TIMESTAMP '\" ~ from_dttm ~ \"'\" if from_dttm else none,\n      \
  \       'to_expr': \"TIMESTAMP '\" ~ to_dttm ~ \"'\" if to_dttm else none} %}\nSELECT * FROM (\nWITH\
  \ source_raw AS (\n    SELECT\n        hosp_name, month, year,\n        tx___1, duration\n    FROM \"\
  v1\".\"UTI Individual Current\"\n    WHERE hosp_name IS NOT NULL\n      AND qi_asb_complete = 2\n  \
  \    AND month IS NOT NULL\n      AND year IS NOT NULL\n\n    UNION ALL\n\n    SELECT\n        hosp_name,\
  \ month, year,\n        tx___1, duration\n    FROM \"v1\".\"UTI Individual Historical\"\n    WHERE hosp_name\
  \ IS NOT NULL\n      AND month IS NOT NULL\n      AND year IS NOT NULL\n), raw_data AS (\nSELECT hosp_name,\
  \ EXTRACT(month FROM date_trunc('{{ grain }}', make_date(year::int, month::int, 1)))::int AS month,\
  \ EXTRACT(year FROM date_trunc('{{ grain }}', make_date(year::int, month::int, 1)))::int AS year, tx___1,\
  \ duration FROM source_raw\nWHERE TRUE\n{% if tf.from_expr %} AND make_date(year::int, month::int, 1)\
  \ >= {{ tf.from_expr }} {% endif %}\n{% if tf.to_expr %} AND make_date(year::int, month::int, 1) < {{\
  \ tf.to_expr }} {% endif %}\n), hospital_agg AS (\n    SELECT \n        i.hosp_name AS hosp_num,\n \
  \       LPAD(i.hosp_name::TEXT, 2, '0') AS hosp_code,\n        TRIM(h.state) AS state,\n        TO_DATE(i.year::TEXT\
  \ || '-' || LPAD(i.month::TEXT, 2, '0') || '-01', 'YYYY-MM-DD') AS month_date,\n        COUNT(*) AS\
  \ ucsub,\n        SUM(CASE WHEN i.tx___1 = 0 AND i.duration IS NOT NULL THEN i.duration ELSE 0 END)\
  \ AS dur_sum,\n        SUM(CASE WHEN i.tx___1 = 0 AND i.duration IS NOT NULL THEN 1 ELSE 0 END) AS dur_count,\n\
  \        CASE \n            WHEN SUM(CASE WHEN i.tx___1 = 0 AND i.duration IS NOT NULL THEN 1 ELSE 0\
  \ END) > 0\n            THEN SUM(CASE WHEN i.tx___1 = 0 AND i.duration IS NOT NULL THEN i.duration ELSE\
  \ 0 END)::FLOAT /\n                 SUM(CASE WHEN i.tx___1 = 0 AND i.duration IS NOT NULL THEN 1 ELSE\
  \ 0 END)\n            ELSE NULL\n        END AS avg_dur\n    FROM raw_data i\n    LEFT JOIN \"v1\".\"\
  CSiM Hospitals and States\" h \n        ON i.hosp_name = h.hosp_code\n    WHERE h.hosp_code IS NOT NULL\n\
  \    GROUP BY i.hosp_name, TRIM(h.state), i.month, i.year\n),\n\nhospital_latest AS (\n    SELECT *\n\
  \    FROM hospital_agg a\n    WHERE month_date = (\n        SELECT MAX(month_date) \n        FROM hospital_agg\
  \ \n        WHERE hosp_code = a.hosp_code\n    )\n),\n\nstate_avg AS (\n    SELECT\n        state,\n\
  \        month_date,\n        SUM(CASE WHEN avg_dur IS NOT NULL THEN avg_dur * ucsub ELSE 0 END) / \n\
  \            NULLIF(SUM(CASE WHEN avg_dur IS NOT NULL THEN ucsub ELSE 0 END), 0) AS state_avg_dur\n\
  \    FROM hospital_agg\n    GROUP BY state, month_date\n),\n\ncohort_avg AS (\n    SELECT\n        month_date,\n\
  \        SUM(CASE WHEN avg_dur IS NOT NULL THEN avg_dur * ucsub ELSE 0 END) / \n            NULLIF(SUM(CASE\
  \ WHEN avg_dur IS NOT NULL THEN ucsub ELSE 0 END), 0) AS cohort_avg_dur\n    FROM hospital_agg\n   \
  \ GROUP BY month_date\n)\n\nSELECT\n    h.hosp_num,\n    h.hosp_code,\n    h.state AS \"State\",\n \
  \   TO_CHAR(h.month_date, '{{ label_format }}') AS \"Month\",\n    ROUND(h.avg_dur::numeric, 1) AS \"\
  Your Hospital (Days)\",\n    ROUND(s.state_avg_dur::numeric, 1) AS \"Your State (Days)\",\n    ROUND(c.cohort_avg_dur::numeric,\
  \ 1) AS \"Cohort (Days)\"\nFROM hospital_latest h\nLEFT JOIN state_avg s ON h.state = s.state AND h.month_date\
  \ = s.month_date\nLEFT JOIN cohort_avg c ON h.month_date = c.month_date\nORDER BY h.hosp_code\n) selected\
  \ WHERE {{ 'TRUE' if filter_values('hosp_code') | length > 0 else 'FALSE' }}\n) p\n) p"
